<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHFM Tender Register — FY 2026–27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F2036;
    --ink-soft:#3A4A5E;
    --ledger:#0F2036;
    --ledger-2:#16304D;
    --paper:#F7F3E9;
    --paper-line:#E4DCC8;
    --paper-shadow: 0 1px 0 rgba(15,32,54,0.06);
    --gold:#C9962C;
    --gold-deep:#8F6A16;
    --red:#A63A32;
    --red-deep:#7A2A24;
    --slate:#6B7686;
    --green:#3E7A52;
    --border:#D9CFB4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 10% -10%, #1B3A5C 0%, transparent 60%),
      var(--ledger);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px;}

  /* ---------- Header ---------- */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
    border-bottom:2px solid rgba(247,243,233,0.15);
    padding-bottom:20px;
    margin-bottom:26px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 8px;
  }
  h1{
    font-family:'Roboto Slab',serif;
    font-weight:900;
    font-size:clamp(28px,4vw,42px);
    line-height:1.05;
    margin:0;
    color:var(--paper);
    letter-spacing:-0.01em;
  }
  h1 span{color:var(--gold);}
  .header-meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:rgba(247,243,233,0.55);
    text-align:right;
    line-height:1.6;
  }
  .header-meta b{color:var(--paper);}

  /* ---------- Stat tiles ---------- */
  .stats{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:10px;
    margin-bottom:22px;
  }
  .stat{
    background:var(--ledger-2);
    border:1px solid rgba(247,243,233,0.12);
    border-radius:4px;
    padding:14px 12px;
    cursor:pointer;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
    position:relative;
    overflow:hidden;
  }
  .stat:hover{transform:translateY(-2px); border-color:rgba(201,150,44,0.5);}
  .stat.active{background:#1E3F63; border-color:var(--gold);}
  .stat .n{
    font-family:'Roboto Slab',serif;
    font-weight:700;
    font-size:26px;
    color:var(--paper);
    display:block;
  }
  .stat .l{
    font-size:10.5px;
    letter-spacing:.04em;
    color:rgba(247,243,233,0.6);
    display:block;
    margin-top:2px;
    line-height:1.3;
  }
  .stat.tone-gold .n{color:var(--gold);}
  .stat.tone-red .n{color:#E08A82;}
  .stat.tone-slate .n{color:#9FB0C4;}
  .stat.tone-green .n{color:#79C295;}

  /* ---------- Controls ---------- */
  .controls{
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .search{
    flex:1;
    min-width:220px;
    position:relative;
  }
  .search input{
    width:100%;
    background:var(--ledger-2);
    border:1px solid rgba(247,243,233,0.18);
    border-radius:4px;
    padding:11px 14px 11px 36px;
    color:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:14px;
  }
  .search input::placeholder{color:rgba(247,243,233,0.4);}
  .search input:focus{outline:2px solid var(--gold); outline-offset:-1px;}
  .search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.5;}

  .sortsel{
    background:var(--ledger-2);
    border:1px solid rgba(247,243,233,0.18);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:10px 12px;
    border-radius:4px;
  }
  .sortsel:focus{outline:2px solid var(--gold); outline-offset:-1px;}

  .count-line{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:rgba(247,243,233,0.5);
    margin-bottom:14px;
  }
  .count-line b{color:var(--gold);}

  /* ---------- Ledger table ---------- */
  .ledger{
    background:var(--paper);
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
  }
  .row{
    display:grid;
    grid-template-columns: 46px 1.6fr 1.9fr 100px 130px 130px;
    gap:0;
    align-items:stretch;
    border-bottom:1px solid var(--paper-line);
    cursor:pointer;
  }
  .row.head{
    background:#EFE8D4;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    cursor:default;
    position:sticky;
    top:0;
  }
  .row.head > div{padding:10px 12px;}
  .row:not(.head):hover{background:#F1EAD6;}
  .row > div{
    padding:14px 12px;
    color:var(--ink);
    font-size:13.5px;
    display:flex;
    align-items:center;
    border-left:1px solid var(--paper-line);
  }
  .row > div:first-child{border-left:none;}
  .c-sr{font-family:'IBM Plex Mono',monospace; color:var(--slate); font-size:12px; justify-content:center;}
  .c-org{flex-direction:column; align-items:flex-start; gap:3px;}
  .c-org .org-name{font-weight:600; line-height:1.35;}
  .c-org .tender-id{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--slate);}
  .c-work{color:var(--ink-soft); font-size:12.5px; line-height:1.4;}
  .c-due{flex-direction:column; align-items:flex-start; gap:2px;}
  .c-due .d{font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600;}
  .c-due .tag{font-size:10px; text-transform:uppercase; letter-spacing:.04em;}
  .tag.overdue{color:var(--red-deep);}
  .tag.soon{color:var(--gold-deep);}
  .c-val{flex-direction:column; align-items:flex-start; gap:2px;}
  .c-val .amt{font-family:'IBM Plex Mono',monospace; font-size:12.5px;}
  .c-val .lbl{font-size:9.5px; color:var(--slate); text-transform:uppercase; letter-spacing:.04em;}

  /* stamp badges */
  .stamp{
    display:inline-block;
    font-family:'Roboto Slab',serif;
    font-weight:700;
    font-size:11px;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:5px 10px;
    border:2px solid currentColor;
    border-radius:3px;
    transform:rotate(-3deg);
    white-space:nowrap;
  }
  .stamp.Awarded{color:var(--green); background:rgba(62,122,82,0.08);}
  .stamp.NotAwarded{color:var(--red-deep); background:rgba(122,42,36,0.06);}
  .stamp.Disqualified{color:var(--red); background:rgba(166,58,50,0.08); transform:rotate(3deg);}
  .stamp.TechnicallyQualified{color:var(--gold-deep); background:rgba(143,106,22,0.08);}
  .stamp.NotMeetingCriteria{color:var(--slate); background:rgba(107,118,134,0.08);}
  .stamp.Pending{color:var(--ink-soft); background:rgba(58,74,94,0.06); border-style:dashed; transform:rotate(0deg);}

  /* detail panel */
  .detail{
    grid-column:1/-1;
    display:none;
    background:#EFE8D4;
    padding:18px 24px 22px;
    border-left:3px solid var(--gold);
  }
  .row.open .detail{display:block;}
  .detail .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px 32px;
  }
  .detail h4{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--slate);
    margin:0 0 6px;
  }
  .detail p{margin:0; font-size:13px; color:var(--ink); line-height:1.5;}
  .row-wrap{display:contents;}

  .empty{
    padding:60px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }

  footer{
    margin-top:22px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:rgba(247,243,233,0.4);
    text-align:center;
  }

  @media (max-width:900px){
    .stats{grid-template-columns:repeat(4,1fr);}
    .row{grid-template-columns: 34px 1.4fr 90px 100px;}
    .c-work{display:none;}
  }
  @media (max-width:560px){
    .stats{grid-template-columns:repeat(2,1fr);}
    .row{grid-template-columns: 1fr 90px;}
    .c-sr{display:none;}
    .c-due{display:none;}
    header{flex-direction:column; align-items:flex-start;}
    .header-meta{text-align:left;}
  }

  @media (prefers-reduced-motion: reduce){
    .stat, .row{transition:none;}
  }
</style>
</head>

</script>
<script>(function(){
  const RAW = JSON.parse(document.getElementById('data-island').textContent);
  const TODAY = new Date('2026-08-14T00:00:00');

  const STATUS_META = {
    'Awarded':               { cls:'Awarded',               label:'Awarded' },
    'Not Awarded':           { cls:'NotAwarded',             label:'Not Awarded' },
    'Disqualified':          { cls:'Disqualified',           label:'Disqualified' },
    'Technically Qualified': { cls:'TechnicallyQualified',   label:'Tech. Qualified' },
    'Not Meeting Criteria':  { cls:'NotMeetingCriteria',     label:'Not Meeting Criteria' },
    'Pending':               { cls:'Pending',                label:'Pending' },
  };

  const STAT_ORDER = ['All','Awarded','Not Awarded','Disqualified','Technically Qualified','Not Meeting Criteria','Pending'];
  const STAT_TONE = {
    'All':'', 'Awarded':'tone-green', 'Not Awarded':'tone-red', 'Disqualified':'tone-red',
    'Technically Qualified':'tone-gold', 'Not Meeting Criteria':'tone-slate', 'Pending':'tone-slate'
  };

  let activeStatus = 'All';
  let searchTerm = '';
  let sortMode = 'due-asc';
  let openRow = null;

  function fmtMoney(n){
    if(n === null || n === undefined) return '—';
    return '₹' + Math.round(n).toLocaleString('en-IN');
  }
  function fmtDate(d){
    if(!d) return '—';
    const dt = new Date(d+'T00:00:00');
    return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  }
  function daysDiff(d){
    if(!d) return null;
    const dt = new Date(d+'T00:00:00');
    return Math.round((dt - TODAY)/86400000);
  }

  function computeStats(){
    const counts = {};
    STAT_ORDER.forEach(s => counts[s]=0);
    counts['All'] = RAW.length;
    RAW.forEach(r => { counts[r.status] = (counts[r.status]||0)+1; });
    return counts;
  }

  function renderStats(){
    const counts = computeStats();
    const el = document.getElementById('stats');
    el.innerHTML = '';
    STAT_ORDER.forEach(s => {
      const div = document.createElement('div');
      div.className = 'stat ' + (STAT_TONE[s]||'') + (activeStatus===s ? ' active':'');
      div.innerHTML = `<span class="n">${counts[s]||0}</span><span class="l">${s}</span>`;
      div.addEventListener('click', () => { activeStatus = s; openRow=null; render(); });
      el.appendChild(div);
    });
  }

  function matches(r){
    if(activeStatus !== 'All' && r.status !== activeStatus) return false;
    if(searchTerm){
      const hay = [r.org, r.tenderId, r.work].filter(Boolean).join(' ').toLowerCase();
      if(!hay.includes(searchTerm.toLowerCase())) return false;
    }
    return true;
  }

  function sortRows(rows){
    const arr = rows.slice();
    switch(sortMode){
      case 'due-asc': arr.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')); break;
      case 'due-desc': arr.sort((a,b)=>(b.due||'0000').localeCompare(a.due||'0000')); break;
      case 'est-desc': arr.sort((a,b)=>(b.estimate||0)-(a.estimate||0)); break;
      case 'est-asc': arr.sort((a,b)=>(a.estimate||1e15)-(b.estimate||1e15)); break;
      case 'org-asc': arr.sort((a,b)=>(a.org||'').localeCompare(b.org||'')); break;
    }
    return arr;
  }

  function renderTable(){
    const filtered = sortRows(RAW.filter(matches));
    document.getElementById('countShown').textContent = filtered.length;
    document.getElementById('countTotal').textContent = RAW.length;

    const ledger = document.getElementById('ledger');
    ledger.innerHTML = '';

    const head = document.createElement('div');
    head.className = 'row head';
    head.innerHTML = `
      <div>Sr</div>
      <div>Organisation</div>
      <div>Scope of Work</div>
      <div>Due</div>
      <div>Estimate</div>
      <div>Status</div>
    `;
    ledger.appendChild(head);

    if(filtered.length === 0){
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'No tenders match this filter.';
      ledger.appendChild(e);
      return;
    }

    filtered.forEach(r => {
      const meta = STATUS_META[r.status] || STATUS_META['Pending'];
      const dd = daysDiff(r.due);
      let tag = '';
      if(dd !== null && r.status === 'Pending'){
        if(dd < 0) tag = `<span class="tag overdue">Overdue ${Math.abs(dd)}d</span>`;
        else if(dd <= 14) tag = `<span class="tag soon">In ${dd}d</span>`;
      }

      const wrap = document.createElement('div');
      wrap.className = 'row-wrap';

      const row = document.createElement('div');
      row.className = 'row' + (openRow === r.sr ? ' open':'');
      row.innerHTML = `
        <div class="c-sr">${r.sr}</div>
        <div class="c-org">
          <span class="org-name">${escapeHtml(r.org||'—')}</span>
          <span class="tender-id">${escapeHtml(r.tenderId||'—')}</span>
        </div>
        <div class="c-work">${escapeHtml(truncate(r.work,110))}</div>
        <div class="c-due">
          <span class="d">${fmtDate(r.due)}</span>
          ${tag}
        </div>
        <div class="c-val">
          <span class="amt">${fmtMoney(r.estimate)}</span>
          <span class="lbl">EMD ${fmtMoney(r.emd)}</span>
        </div>
        <div><span class="stamp ${meta.cls}">${meta.label}</span></div>
      `;
      row.addEventListener('click', () => {
        openRow = (openRow === r.sr) ? null : r.sr;
        renderTable();
      });
      wrap.appendChild(row);

      if(openRow === r.sr){
        const detail = document.createElement('div');
        detail.className = 'row open';
        detail.style.display='block';
        detail.innerHTML = `
          <div class="detail" style="display:block;">
            <div class="grid">
              <div>
                <h4>Full Scope of Work</h4>
                <p>${escapeHtml(r.work||'—')}</p>
              </div>
              <div>
                <h4>Status Detail / Filing Note</h4>
                <p>${escapeHtml([r.note, r.statusDetail].filter(Boolean).join(' — ') || 'No update recorded yet.')}</p>
              </div>
              <div>
                <h4>EMD / Eligibility Note</h4>
                <p>${escapeHtml(truncate(r.emdType,400) || '—')}</p>
              </div>
              <div>
                <h4>Financials</h4>
                <p>Estimate: ${fmtMoney(r.estimate)} &nbsp;·&nbsp; EMD: ${fmtMoney(r.emd)}</p>
              </div>
            </div>
          </div>
        `;
        ledger.appendChild(row);
        ledger.appendChild(detail);
      } else {
        ledger.appendChild(row);
      }
    });
  }

  function truncate(s, n){
    if(!s) return s;
    return s.length > n ? s.slice(0,n-1)+'…' : s;
  }
  function escapeHtml(s){
    if(s===null||s===undefined) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render(){
    renderStats();
    renderTable();
  }

  document.getElementById('searchInput').addEventListener('input', e => {
    searchTerm = e.target.value;
    openRow = null;
    render();
  });
  document.getElementById('sortSelect').addEventListener('change', e => {
    sortMode = e.target.value;
    render();
  });

  document.getElementById('asof').textContent = TODAY.toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});

  render();
})();
</script>
