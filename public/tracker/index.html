<title>KHFM Tracker</title>

<style>
  :root{
    --ink:#1B3E6F;
    --paper:#EEF1F6;
    --surface:#FFFFFF;
    --accent:#C0272D;
    --accent-ink:#8F1D22;
    --steel:#5C6B7A;
    --line:#D7DEE6;
    --profit:#1F7A4C;
    --loss:#B5312F;
    --profit-bg:#E3F1E9;
    --loss-bg:#F8E5E4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .disp{font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.02em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  input,select,textarea{
    font-family:'IBM Plex Mono',monospace;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    padding:10px 10px;
    border-radius:3px;
    font-size:16px;
    width:100%;
    min-width:90px;
  }
  select{font-family:'IBM Plex Sans',sans-serif;font-size:16px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  button{
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:500;
    cursor:pointer;
    border-radius:3px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    padding:10px 16px;
    font-size:14px;
  }
  button:hover{border-color:var(--steel);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#FCF3EC;}
  button.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);}
  button.ghost{border-color:transparent;background:transparent;color:var(--steel);}
  button.danger{color:var(--loss);}
  table{border-collapse:collapse;width:100%;}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;}
  th{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--steel);border-bottom:2px solid var(--ink);}
  td.num, th.num{text-align:right;}
  tr:last-child td{border-bottom:none;}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:2px;font-weight:500;}
  .badge.role{background:rgba(192,39,45,0.14);color:var(--accent-ink);}
  .status-new{background:#E3EAF4;color:#1B3E6F;}
  .status-follow-up{background:#FDE9D0;color:#8A5A22;}
  .status-converted{background:#E3F1E9;color:#1F7A4C;}
  .status-lost{background:#F8E5E4;color:#B5312F;}
  .status-completed{background:#E3F1E9;color:#1F7A4C;}
  .status-pending{background:#F8E5E4;color:#B5312F;}
  .status-rescheduled{background:#FDE9D0;color:#8A5A22;}
  .stat-card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;}
  .stat-card p.label{font-size:10px;text-transform:uppercase;color:var(--steel);margin:0 0 6px;letter-spacing:.05em;}
  .stat-card p.value{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;margin:0;color:var(--ink);}
  #app-shell{display:flex;min-height:100vh;}
  #nav{width:200px;flex-shrink:0;background:var(--ink);color:#EDE7D9;padding:24px 0;}
  #main{flex:1;padding:32px 40px;max-width:1200px;}
  .nav-item{transition:background 0.15s ease;}
  .nav-item:hover{background:rgba(255,255,255,0.07) !important;}
  #mobile-bar{display:none;}
  .nav-close{display:none;}
  #nav-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,32,0.5);z-index:60;}
  #nav-backdrop.show{display:block;}
  @media (max-width:768px){
    #app-shell{flex-direction:column;}
    #mobile-bar{display:flex;align-items:center;gap:12px;background:var(--ink);color:#EDE7D9;padding:14px 16px;position:sticky;top:0;z-index:40;}
    #mobile-bar button{background:transparent;border:1px solid #3A4956;color:#EDE7D9;font-size:18px;line-height:1;padding:6px 11px;border-radius:3px;}
    #mobile-bar span{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;letter-spacing:.02em;}
    #nav{
      position:fixed;top:0;left:0;height:100vh;width:82%;max-width:300px;
      transform:translateX(-100%);transition:transform .25s ease;
      z-index:70;overflow-y:auto;display:block;padding:0;
      box-shadow:2px 0 16px rgba(0,0,0,0.35);
    }
    #nav.open{transform:translateX(0);}
    #nav > div:first-child{border-right:none;white-space:normal;padding:20px !important;position:relative;}
    .nav-close{display:block;position:absolute;top:12px;right:12px;background:transparent;border:1px solid #3A4956;color:#EDE7D9;width:32px;height:32px;padding:0;font-size:16px;line-height:1;border-radius:3px;}
    #main{padding:16px;max-width:100%;}
    #gate > div{padding:32px 20px;}
    h2.disp{font-size:22px !important;}
    h3.disp{font-size:16px !important;}
  }
</style>
</head>

function uid(){ return Math.random().toString(36).slice(2,10); }
function statusClass(s){ return 'status-' + (s||'').toLowerCase().replace(/\s+/g,'-'); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtCurrency(n){
  n = Math.round(n||0);
  const neg = n<0;
  const abs = Math.abs(n).toLocaleString('en-IN');
  return (neg?'(':'')+'\u20B9'+abs+(neg?')':'');
}

async function api(path, options){
  options = options || {};
  options.headers = Object.assign({'Content-Type':'application/json'}, options.headers||{}, token?{'Authorization':'Bearer '+token}:{});
  const res = await fetch(BASE + path, options);
  const data = await res.json().catch(()=>({}));
  if(!res.ok){ throw new Error(data.error || ('Request failed ('+res.status+')')); }
  return data;
}

async function tryUnlock(){
  const input = document.getElementById('pw-input').value;
  const errEl = document.getElementById('pw-error');
  errEl.style.display='none';
  try{
    const result = await api('/api/login', {method:'POST', body: JSON.stringify({password: input})});
    token = result.token;
    sessionStorage.setItem('khfm-tracker-token', token);
    currentProfile = result.profile;
    await loadState();
    currentSection = currentProfile.sections[0];
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    renderNav();
    renderPage();
  }catch(e){
    errEl.textContent = e.message || 'Incorrect password. Try again.';
    errEl.style.display='block';
  }
}
document.getElementById('pw-input').addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });

async function loadState(){
  const result = await api('/api/state');
  state = Object.assign({}, result.records);
}

function logout(){
  window.location.href = '/logout';

function queueSaveRecords(key){
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(async ()=>{
    try{ await api('/api/state/records', {method:'POST', body: JSON.stringify({key, value: state[key]})}); }
    catch(e){ alert('Could not save: '+e.message); }
  }, 400);
}

function timeAgo(ms){
  const s = Math.round((Date.now()-ms)/1000);
  if(s<60) return s+'s ago';
  const m = Math.round(s/60);
  if(m<60) return m+'m ago';
  const h = Math.round(m/60);
  if(h<24) return h+'h ago';
  return Math.round(h/24)+'d ago';
}

async function downloadBackup(){
  try{
    const res = await fetch(BASE+'/api/admin/backup', {headers:{'Authorization':'Bearer '+token}});
    if(!res.ok){ const d = await res.json().catch(()=>({})); throw new Error(d.error||'Backup failed.'); }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'khfm-tracker-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(e){ alert(e.message); }
}
async function restoreBackup(file){
  if(!file) return;
  if(!confirm('This replaces ALL current data in this app with the backup file. Continue?')) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    await api('/api/admin/restore', {method:'POST', body: JSON.stringify(parsed)});
    alert('Restored.');
    window.location.reload();
  }catch(e){ alert('Restore failed: '+e.message); }
}
async function setLoginPassword(profileId){
  const input = document.getElementById('np-'+profileId);
  if(!input.value) return;
  try{
    await api('/api/admin/set-password', {method:'POST', body: JSON.stringify({profileId, password: input.value})});
    input.value='';
    alert('Password updated.');
  }catch(e){ alert(e.message); }
}

      <button class="ghost" style="color:#8C979E;padding:0;font-size:12px;" onclick="logout()">Log out</button>
      <a href="/" style="color:#8C979E;font-size:12px;text-decoration:none;">&larr; All KHFM apps</a>
    </div>
  `;
  const titleEl = document.getElementById('mobile-bar-title');
  if(titleEl){
    const current = SECTIONS.find(s=>s.id===currentSection);
    titleEl.textContent = current ? current.label : 'KHFM Tracker';
  }
}
function toggleNav(){
  document.getElementById('nav').classList.toggle('open');
  document.getElementById('nav-backdrop').classList.toggle('show');
}
function closeNav(){
  document.getElementById('nav').classList.remove('open');
  document.getElementById('nav-backdrop').classList.remove('show');
}
function goTo(id){ currentSection = id; renderNav(); renderPage(); closeNav(); }

function renderPage(){
  const page = document.getElementById('page');
  if(currentSection==='dashboard') return renderDashboard(page);
  if(currentSection==='hk_active_sites') return renderActiveSites(page, 'hk_active_sites', 'Housekeeping Active Sites');
  if(currentSection==='hk_bills') return renderBills(page);
  const line = LINES.find(l=>l.enqKey===currentSection || l.svcKey===currentSection);
  if(line && line.enqKey===currentSection) return renderEnquiries(page, line.enqKey, line.label+' Enquiries');
  if(line && line.svcKey===currentSection) return renderDailyServices(page, line.svcKey, line.label+' Daily Services');
}

    <table style="min-width:950px;">
      <tr><th>Date</th><th>Client</th><th>Contact</th><th>Source</th><th>Status</th><th>Assigned to</th><th>Notes</th><th></th></tr>

function addEnquiry(key){
  state[key] = state[key] || [];

  queueSaveRecords(key); renderPage();
}

    <div style="overflow-x:auto;">
    <table style="min-width:950px;">
      <tr><th>Date</th><th>Client / Site</th><th>Staff</th><th>Status</th><th class="num">Service Amount</th><th>Remarks</th><th></th></tr>

        <tr>

function addDailyService(key){
  state[key] = state[key] || [];
  state[key].push({id:uid(), date:todayStr(), client:'', staff:'', status:'Pending', amount:0, remarks:''});

function updateAmount(key, id, value){
  const row = (state[key]||[]).find(r=>r.id===id);

  queueSaveRecords(key);
}

function addActiveSite(key){
  state[key] = state[key] || [];
  state[key].push({id:uid(), site:'', startDate:todayStr(), manpower:0, monthlyBilling:0});
  queueSaveRecords(key); renderPage();
}
function updateNumberField(key, id, field, value){
  const row = (state[key]||[]).find(r=>r.id===id);
  if(!row) return;
  row[field] = parseFloat(value)||0;
  queueSaveRecords(key);
}

function updateRecord(key, id, field, value){
  const row = (state[key]||[]).find(r=>r.id===id);
  if(!row) return;
  row[field] = value;
  queueSaveRecords(key);
}

async function renderBills(page){
  page.innerHTML = `<h2 class="disp" style="font-size:26px;margin:0 0 4px;">Housekeeping Bills</h2><p style="color:var(--steel);font-size:13px;">Loading...</p>`;
  let bills = [];
  try{ bills = await api('/api/bills'); }
  catch(e){ page.innerHTML += `<p style="color:var(--loss);">${e.message}</p>`; return; }
  const sites = (state.hk_active_sites||[]).map(s=>s.site).filter(Boolean);
  const sorted = bills.slice().sort((a,b)=> (b.month||'').localeCompare(a.month||'') || (a.site||'').localeCompare(b.site||''));
  page.innerHTML = `
    <h2 class="disp" style="font-size:26px;margin:0 0 4px;">Housekeeping Bills</h2>
    <p style="color:var(--steel);font-size:13px;margin:0 0 24px;">Upload and download monthly bills for each site.</p>
    <div style="background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:24px;max-width:520px;">
      <p style="font-size:12px;color:var(--steel);text-transform:uppercase;letter-spacing:.05em;margin:0 0 4px;">Upload a bill</p>
      <p style="font-size:11px;color:var(--steel);margin:0 0 10px;">PDF only, up to 8MB.</p>
      <input id="bill-site" list="bill-site-list" placeholder="Site name" style="margin-bottom:10px;">
      <datalist id="bill-site-list">${sites.map(s=>`<option value="${s}">`).join('')}</datalist>
      <input id="bill-month" type="month" value="${todayStr().slice(0,7)}" style="margin-bottom:10px;">
      <input id="bill-file" type="file" accept=".pdf,application/pdf" style="margin-bottom:10px;">
      <button onclick="uploadBill()">Upload</button>
      <p id="bill-upload-msg" style="font-size:12px;color:var(--loss);margin:8px 0 0;"></p>
    </div>
    <div style="overflow-x:auto;">
    <table style="min-width:650px;">
      <tr><th>Month</th><th>Site</th><th>File</th><th>Uploaded</th><th></th></tr>
      ${sorted.map(b=>`
        <tr>
          <td>${b.month||'—'}</td>
          <td>${b.site||'—'}</td>
          <td>${b.fileName||'—'}</td>
          <td>${new Date(b.uploadedAt).toLocaleDateString('en-IN')}</td>
          <td style="white-space:nowrap;">
            <button class="ghost" onclick="viewBill('${b.id}')">View</button>
            <button class="ghost" onclick="downloadBill('${b.id}','${(b.fileName||'bill').replace(/'/g,"")}')">Download</button>
            <button class="danger ghost" onclick="removeBill('${b.id}')">Remove</button>
          </td>
        </tr>
      `).join('')}
      ${sorted.length===0?'<tr><td colspan="5" style="color:var(--steel);">No bills uploaded yet.</td></tr>':''}
    </table>
    </div>
  `;
}
function fileToDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function uploadBill(){
  const site = document.getElementById('bill-site').value.trim();
  const month = document.getElementById('bill-month').value;
  const fileInput = document.getElementById('bill-file');
  const file = fileInput.files[0];
  const msgEl = document.getElementById('bill-upload-msg');
  msgEl.textContent = '';
  if(!site || !month || !file){ msgEl.textContent = 'Site, month, and a file are all required.'; return; }
  if(!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf'){ msgEl.textContent = 'Only PDF files are allowed.'; return; }
  if(file.size > 8*1024*1024){ msgEl.textContent = 'File is too large (max 8MB).'; return; }
  try{
    const fileData = await fileToDataUrl(file);
    await api('/api/bills/upload', {method:'POST', body: JSON.stringify({site, month, fileName:file.name, fileData})});
    renderPage();
  }catch(e){ msgEl.textContent = e.message; }
}
async function viewBill(id){
  try{
    const res = await fetch(BASE+'/api/bills/'+id+'/download', {headers:{'Authorization':'Bearer '+token}});
    if(!res.ok){ const d = await res.json().catch(()=>({})); throw new Error(d.error||'Could not open file.'); }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(e){ alert(e.message); }
}
async function downloadBill(id, fileName){
  try{
    const res = await fetch(BASE+'/api/bills/'+id+'/download', {headers:{'Authorization':'Bearer '+token}});
    if(!res.ok){ const d = await res.json().catch(()=>({})); throw new Error(d.error||'Download failed.'); }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName || 'bill';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(e){ alert(e.message); }
}
async function removeBill(id){
  if(!confirm('Remove this bill?')) return;
  try{
    await api('/api/bills/'+id+'/remove', {method:'POST'});
    renderPage();
  }catch(e){ alert(e.message); }
}
function removeRecord(key, id){
  if(!confirm('Remove this entry?')) return;
  state[key] = (state[key]||[]).filter(r=>r.id!==id);
  queueSaveRecords(key); renderPage();
}

async function startFromSession(){
  try{
    const result = await api('/api/me');
    currentProfile = result.profile;
    await loadState();
    currentSection = currentProfile.sections[0];
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    renderNav();
    renderPage();
  }catch(e){
    window.location.href = '/login?next=' + encodeURIComponent(BASE + '/');
  }
}
startFromSession();
