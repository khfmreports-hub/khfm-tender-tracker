<style>
  :root{
    --ink:#1B3E6F;
    --paper:#EEF1F6;
    --surface:#FFFFFF;
    --accent:#C0272D;
    --accent-ink:#8F1D22;
    --steel:#5C6B7A;
    --line:#D7DEE6;
    --profit:#1F7A4C;
    --loss:#B5312F;
    --profit-bg:#E3F1E9;
    --loss-bg:#F8E5E4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .disp{font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.02em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  input,select{
    font-family:'IBM Plex Mono',monospace;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    padding:10px 10px;
    border-radius:3px;
    font-size:16px;
    width:100%;
    min-width:90px;
  }
  input[type=number]{
    font-size:16px;
    padding:12px 10px;
    min-width:100px;
  }
  select{font-family:'IBM Plex Sans',sans-serif;font-size:16px;}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  button{
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:500;
    cursor:pointer;
    border-radius:3px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    padding:10px 16px;
    font-size:14px;
  }
  button:hover{border-color:var(--steel);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#FCF3EC;}
  button.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);}
  button.ghost{border-color:transparent;background:transparent;color:var(--steel);}
  button.danger{color:var(--loss);}
  table{border-collapse:collapse;width:100%;}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;}
  th{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--steel);border-bottom:2px solid var(--ink);}
  td.num, th.num{text-align:right;}
  tr:last-child td{border-bottom:none;}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:2px;font-weight:500;}
  .badge.sitewise{background:#E3EAF4;color:var(--ink);}
  .badge.private{background:#F6E6D8;color:#8A5A22;}
  .badge.role{background:rgba(192,39,45,0.14);color:var(--accent-ink);}
  .nav-item{transition:background 0.15s ease;}
  .nav-item:hover{background:rgba(255,255,255,0.07) !important;}
  #app-shell{display:flex;min-height:100vh;}
  #nav{width:200px;flex-shrink:0;background:var(--ink);color:#EDE7D9;padding:24px 0;}
  #main{flex:1;padding:32px 40px;max-width:1200px;}
  @media (max-width:768px){
    #app-shell{flex-direction:column;}
    #nav{width:100%;padding:0;display:flex;flex-direction:row;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    #nav > div:first-child{padding:14px 16px;border-bottom:none !important;border-right:1px solid #2C3B47;flex-shrink:0;white-space:nowrap;margin-bottom:0 !important;}
    #main{padding:16px;max-width:100%;}
    #gate > div{padding:32px 20px;}
    h2.disp{font-size:22px !important;}
    h3.disp{font-size:16px !important;}
  }
</style>
</head>

const BASE = '/report';
let token = null;
let state = null;
let currentProfile = null;
let currentSection = null;
let saveTimer = null;

function uid(){ return Math.random().toString(36).slice(2,10); }

async function api(path, options){
  options = options || {};
  options.headers = Object.assign({'Content-Type':'application/json'}, options.headers||{}, token?{'Authorization':'Bearer '+token}:{});
  const res = await fetch(BASE + path, options);
  const data = await res.json().catch(()=>({}));
  if(!res.ok){ throw new Error(data.error || ('Request failed ('+res.status+')')); }
  return data;
}

async function tryUnlock(){
  const input = document.getElementById('pw-input').value;
  const errEl = document.getElementById('pw-error');
  errEl.style.display='none';
  try{
    const result = await api('/api/login', {method:'POST', body: JSON.stringify({password: input})});
    token = result.token;
    sessionStorage.setItem('khfm-token', token);
    currentProfile = result.profile;
    await loadState();
    currentSection = currentProfile.sections[0];
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    renderNav();
    renderPage();
  }catch(e){
    errEl.textContent = e.message || 'Incorrect password. Try again.';
    errEl.style.display='block';
  }
}
document.getElementById('pw-input').addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });

async function loadState(){
  const result = await api('/api/state');
  state = Object.assign({sites: result.sites}, result.sections);
  state.canEditSites = result.canEditSites;
}

function logout(){
  window.location.href = '/logout';
}

function queueSaveSection(key){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await api('/api/state/section', {method:'POST', body: JSON.stringify({key, value: state[key]})}); }
    catch(e){ alert('Could not save: '+e.message); }
  }, 400);
}
function queueSaveSites(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await api('/api/state/sites', {method:'POST', body: JSON.stringify({sites: state.sites})}); }
    catch(e){ alert('Could not save: '+e.message); }
  }, 400);
}

function timeAgo(ms){
  const s = Math.round((Date.now()-ms)/1000);
  if(s<60) return s+'s ago';
  const m = Math.round(s/60);
  if(m<60) return m+'m ago';
  const h = Math.round(m/60);
  if(h<24) return h+'h ago';
  return Math.round(h/24)+'d ago';
}

async function manageLogins(){
  if(currentProfile.id!=='admin'){ alert('Only the full-access login can manage passwords.'); return; }
  const page = document.getElementById('page');
  let profiles, sessionsList;
  try{
    profiles = await api('/api/admin/profiles');

async function downloadBackup(){
  try{
    const res = await fetch(BASE+'/api/admin/backup', {headers:{'Authorization':'Bearer '+token}});
    if(!res.ok){ const d = await res.json().catch(()=>({})); throw new Error(d.error||'Backup failed.'); }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'khfm-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(e){ alert(e.message); }
}
async function restoreBackup(file){
  if(!file) return;
  if(!confirm('This replaces ALL current data in this app with the backup file. Continue?')) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    await api('/api/admin/restore', {method:'POST', body: JSON.stringify(parsed)});
    alert('Restored.');
    window.location.reload();
  }catch(e){ alert('Restore failed: '+e.message); }
}
async function setLoginPassword(profileId){
  const input = document.getElementById('np-'+profileId);
  if(!input.value) return;
  try{
    await api('/api/admin/set-password', {method:'POST', body: JSON.stringify({profileId, password: input.value})});
    input.value='';
    alert('Password updated.');
  }catch(e){ alert(e.message); }
}

function goTo(id){ currentSection = id; renderNav(); renderPage(); }

function fmtCurrency(n){
  n = Math.round(n||0);
  const neg = n<0;
  const abs = Math.abs(n).toLocaleString('en-IN');
  return (neg?'(':'')+'\u20B9'+abs+(neg?')':'');
}
function fmtNum(n){ return Math.round(n||0).toLocaleString('en-IN'); }
function totalOf(entry){ if(!entry) return 0; return MONTHS.reduce((sum,m)=>sum+(entry[m]||0),0); }

function renderPage(){
  const page = document.getElementById('page');
  if(currentSection==='dashboard') return renderDashboard(page);
  if(currentSection==='site_master') return renderSiteMaster(page);
  if(currentSection==='subcontractor_pl') return renderSubcontractor(page);
  return renderMetricPage(page, currentSection);
}

function renderMetricPage(page, key){
  const meta = SIMPLE_METRICS[key];
  const data = state[key] || {};
  const isCurrency = meta.unit==='currency';
  page.innerHTML = `
    <h2 class="disp" style="font-size:26px;margin:0 0 4px;">${meta.label}</h2>
    <p style="color:var(--steel);font-size:13px;margin:0 0 24px;">January to December 2026, per site. Values save automatically.</p>
    <div style="overflow-x:auto;">
    <table style="min-width:1550px;">
      <tr><th>Site</th>${MONTHS.map(m=>`<th class="num">${MONTH_LABELS[m]}</th>`).join('')}<th class="num">2026 total</th></tr>
      ${state.sites.map(site=>{
        const e = data[site.id] || {};
        return `<tr>
          <td>${site.name}</td>
          ${MONTHS.map(m=>`<td class="num"><input type="number" value="${e[m]||''}" oninput="updateMetric('${key}','${site.id}','${m}',this.value)"></td>`).join('')}
          <td class="num mono" id="total-${key}-${site.id}">${isCurrency?fmtCurrency(totalOf(e)):fmtNum(totalOf(e))}</td>
        </tr>`;
      }).join('')}
      ${state.sites.length===0?`<tr><td colspan="${MONTHS.length+2}" style="color:var(--steel);">No sites available yet.</td></tr>`:''}
    </table>
    </div>
  `;
}
function updateMetric(key, siteId, month, value){
  if(!state[key]) state[key] = {};
  if(!state[key][siteId]) state[key][siteId] = {};
  state[key][siteId][month] = parseFloat(value)||0;
  queueSaveSection(key);
  const meta = SIMPLE_METRICS[key];
  const cell = document.getElementById('total-'+key+'-'+siteId);
  if(cell){
    const total = totalOf(state[key][siteId]);
    cell.textContent = meta.unit==='currency' ? fmtCurrency(total) : fmtNum(total);
  }
}
function renderPageQuiet(){
  const scrollY = window.scrollY;
  renderPage();
  window.scrollTo(0, scrollY);
}

function renderSiteMaster(page){
  page.innerHTML = `
    <h2 class="disp" style="font-size:26px;margin:0 0 4px;">Site master</h2>
    <p style="color:var(--steel);font-size:13px;margin:0 0 24px;">Every site lives here once. Other tabs reference these sites automatically. Use the arrows to reorder — the order here controls the order everywhere else.</p>
    <table>
      <tr><th></th><th>Name</th><th>Type</th><th>Location</th><th>In-charge</th><th></th></tr>
      ${state.sites.map((site,i)=>`
        <tr>
          <td style="white-space:nowrap;">
            <button class="ghost" style="padding:4px 8px;" onclick="moveSite('${site.id}',-1)" ${i===0?'disabled':''} title="Move up">▲</button>
            <button class="ghost" style="padding:4px 8px;" onclick="moveSite('${site.id}',1)" ${i===state.sites.length-1?'disabled':''} title="Move down">▼</button>
          </td>
          <td><input value="${site.name}" oninput="updateSite('${site.id}','name',this.value)"></td>
          <td>
            <select onchange="updateSite('${site.id}','type',this.value)">
              <option ${site.type==='Tender'?'selected':''}>Tender</option>
              <option ${site.type==='Private'?'selected':''}>Private</option>
            </select>
          </td>
          <td><input value="${site.location||''}" oninput="updateSite('${site.id}','location',this.value)"></td>
          <td><input value="${site.incharge||''}" oninput="updateSite('${site.id}','incharge',this.value)"></td>
          <td><button class="danger ghost" onclick="removeSite('${site.id}')">Remove</button></td>
        </tr>
      `).join('')}
    </table>
    <button style="margin-top:16px;" onclick="addSite()">+ Add site</button>
  `;
}
function addSite(){
  state.sites.push({id:uid(), name:'New site', type:'Tender', location:'', incharge:''});
  queueSaveSites(); renderPage();
}
function updateSite(id, field, value){
  const site = state.sites.find(s=>s.id===id);
  if(site) site[field]=value;
  queueSaveSites();
}
function removeSite(id){
  if(!confirm('Remove this site? Its entries in other tabs will stay but no longer show here.')) return;
  state.sites = state.sites.filter(s=>s.id!==id);
  queueSaveSites(); renderPage();
}
function moveSite(id, direction){
  const i = state.sites.findIndex(s=>s.id===id);
  const j = i + direction;
  if(i<0 || j<0 || j>=state.sites.length) return;
  const tmp = state.sites[i];
  state.sites[i] = state.sites[j];
  state.sites[j] = tmp;
  queueSaveSites(); renderPage();
}

function renderSubcontractor(page){
  const rows = state.subcontractor_pl || [];
  page.innerHTML = `
    <h2 class="disp" style="font-size:26px;margin:0 0 4px;">Subcontractor P/L</h2>
    <p style="color:var(--steel);font-size:13px;margin:0 0 24px;">One row per subcontractor per site, January to December 2026.</p>
    <div style="overflow-x:auto;">
    <table style="min-width:1750px;">
      <tr><th>Site</th><th>Subcontractor</th>${MONTHS.map(m=>`<th class="num">${MONTH_LABELS[m]}</th>`).join('')}<th class="num">2026 total</th><th></th></tr>
      ${rows.map(r=>`
        <tr>
          <td>
            <select onchange="updateSub('${r.id}','siteId',this.value)">
              ${state.sites.map(s=>`<option value="${s.id}" ${s.id===r.siteId?'selected':''}>${s.name}</option>`).join('')}
            </select>
          </td>
          <td><input value="${r.name}" oninput="updateSub('${r.id}','name',this.value)"></td>
          ${MONTHS.map(m=>`<td class="num"><input type="number" value="${r[m]||''}" oninput="updateSub('${r.id}','${m}',this.value)"></td>`).join('')}
          <td class="num mono" id="subtotal-${r.id}">${fmtCurrency(totalOf(r))}</td>
          <td><button class="danger ghost" onclick="removeSub('${r.id}')">Remove</button></td>
        </tr>
      `).join('')}
      ${rows.length===0?`<tr><td colspan="${MONTHS.length+4}" style="color:var(--steel);">No subcontractor entries yet.</td></tr>`:''}
    </table>
    </div>
    <button style="margin-top:16px;" onclick="addSub()">+ Add subcontractor entry</button>
  `;
}
function addSub(){
  if(state.sites.length===0){ alert('No sites available.'); return; }
  if(!state.subcontractor_pl) state.subcontractor_pl = [];
  state.subcontractor_pl.push({id:uid(), siteId:state.sites[0].id, name:'New subcontractor'});
  queueSaveSection('subcontractor_pl'); renderPage();
}
function updateSub(id, field, value){
  const row = (state.subcontractor_pl||[]).find(r=>r.id===id);
  if(!row) return;
  row[field] = MONTHS.includes(field) ? (parseFloat(value)||0) : value;
  queueSaveSection('subcontractor_pl');
  const cell = document.getElementById('subtotal-'+id);
  if(cell) cell.textContent = fmtCurrency(totalOf(row));
}
function removeSub(id){
  state.subcontractor_pl = (state.subcontractor_pl||[]).filter(r=>r.id!==id);
  queueSaveSection('subcontractor_pl'); renderPage();
}

async function startFromSession(){
  try{
    const result = await api('/api/me');
    currentProfile = result.profile;
    await loadState();
    currentSection = currentProfile.sections[0];
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    renderNav();
    renderPage();
  }catch(e){
    window.location.href = '/login?next=' + encodeURIComponent(BASE + '/');
  }
}
startFromSession();
</script>
